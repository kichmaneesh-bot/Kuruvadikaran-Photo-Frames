      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          export PATH="$SDKMANAGER_DIR:$PATH"
5
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
