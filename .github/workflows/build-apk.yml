name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project

          unzip -q KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip \
            -d build-project

      - name: Locate project
        run: |
          find build-project -name settings.gradle.kts -print

      - name: Fix Kotlin JVM target
        run: |
          PROJECT_DIR=$(dirname "$(find build-project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR"

          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          addition = r'''
          
          kotlin {
              jvmToolchain(17)
          }
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          '''

          if "jvmToolchain(17)" not in s:
              s += addition

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("JVM 17 configuration added.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find build-project -name settings.gradle.kts -print -quit)")

          echo "Building:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK:"
          find build-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuruvadikaranPhotoFrames-APK
          path: build-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
