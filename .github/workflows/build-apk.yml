name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project

          unzip -q KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip \
            -d build-project

      - name: Find Android project
        run: |
          echo "Searching Android project..."
          find build-project -name "settings.gradle.kts" -o -name "settings.gradle"

      - name: Fix JVM target
        run: |
          echo "Fixing Kotlin JVM target..."

          find build-project -type f \( \
            -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "*.kt" \
          \) -print0 | xargs -0 sed -i \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']21["'\'']/jvmTarget = "17"/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']20["'\'']/jvmTarget = "17"/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']19["'\'']/jvmTarget = "17"/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']18["'\'']/jvmTarget = "17"/g' \
            -e 's/jvmToolchain([[:space:]]*21[[:space:]]*)/jvmToolchain(17)/g'

          echo "JVM target fix completed."

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find build-project \
            -name settings.gradle.kts \
            -o -name settings.gradle | head -n 1)")

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "APK files:"
          find build-project -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KuruvadikaranPhotoFrames-APK
          path: build-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
