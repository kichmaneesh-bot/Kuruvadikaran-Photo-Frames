name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
  - name: Fix JVM target
  run: |
    find . -name "*.gradle.kts" -exec sed -i 's/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' {} +
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          unzip -o KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Fix JVM target
        run: |
          find . -name "*.gradle.kts" -exec sed -i 's/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' {} +
      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuruvadikaran-Photo-Frame-APK
          path: app/build/outputs/apk/debug/*.apk
