name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find the FIXED ZIP
      - name: Find FIXED project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for FIXED project..."

          ZIP_FILE=$(find . -type f \
            -name "KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FIXED ZIP file was not found."
            echo ""
            echo "ZIP files available:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "FIXED ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3. Extract FIXED project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d android-project

          echo ""
          echo "Extracted project:"
          find android-project -maxdepth 5 -type f | sort | head -200

      # 4. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 7. Find Android Gradle project
