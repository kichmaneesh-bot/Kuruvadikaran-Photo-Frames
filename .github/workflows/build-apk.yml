name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract fixed project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip -d build-project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: build-project/KuruvadikaranPhotoFramesFirebase
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuruvadikaranPhotoFrames-APK
          path: build-project/KuruvadikaranPhotoFramesFirebase/app/build/outputs/apk/debug/app-debug.apk
