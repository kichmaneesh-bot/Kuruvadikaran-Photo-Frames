name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          unzip -o KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          echo "Searching Android project..."

          find . -name "build.gradle.kts" -type f -print

          find . -name "build.gradle.kts" -type f -exec sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*"1.8"/jvmTarget = "17"/g' \
            -e "s/jvmTarget[[:space:]]*=[[:space:]]*'1.8'/jvmTarget = '17'/g" \
            {} \;

          echo "Java/Kotlin target fixed."

      - name: Show project files
        run: |
          find . -maxdepth 4 -type f \
            \( -name "build.gradle.kts" -o -name "settings.gradle.kts" \) \
            -print

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug \
            -Pkotlin.jvm.target.validation.mode=warning

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuruvadikaran-Photo-Frame-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
