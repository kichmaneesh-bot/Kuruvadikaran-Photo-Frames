name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Find Android project folder
        run: |
          SETTINGS_FILE=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts/settings.gradle not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Check Android project
        run: |
          cd "$PROJECT_DIR"
          echo "Project files:"
          ls -la
          echo "App folder:"
          ls -la app

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuruvadikaran-Photo-Frames-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs
