- name: Checkout
    uses: actions/checkout@v4

  - name: Extract FIXED Android project
    shell: bash
    run: |
      set -e

      ZIP_FILE=$(find . -maxdepth 2 -type f -name "KuruvadikaranPhotoFrames_FirebaseConnected_FIXED.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: FIXED project ZIP not found."
        find . -maxdepth 3 -type f | sort
        exit 1
      fi

      echo "Using: $ZIP_FILE"
      mkdir -p android-project
      unzip -o "$ZIP_FILE" -d android-project

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-35"
      sdkmanager "build-tools;35.0.0"

  - name: Find Gradle project
    shell: bash
    run: |
      set -e

      PROJECT_DIR=$(find android-project \
        -type f \
        \-name "settings.gradle" -o -name "settings.gradle.kts" \ \
        -print -quit | xargs -r dirname)

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Gradle project not found."
        find android-project -maxdepth 6 -type f | sort
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project: $PROJECT_DIR"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build Debug APK
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
      else
        gradle assembleDebug --no-daemon --stacktrace
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Kuruvadikaran-Photo-Frame-APK
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
